name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Test (Bun ${{ matrix.bun-version }})
    runs-on: windows-latest

    strategy:
      matrix:
        bun-version: ["latest"]

    defaults:
      run:
        working-directory: foxpro-mcp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

  build:
    name: Build binary
    runs-on: windows-latest
    needs: test

    defaults:
      run:
        working-directory: foxpro-mcp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build executable
        run: bun run build

      - name: Verify binary exists
        run: Test-Path foxpro-mcp.exe

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: foxpro-mcp-windows
          path: foxpro-mcp/foxpro-mcp.exe
          retention-days: 7
