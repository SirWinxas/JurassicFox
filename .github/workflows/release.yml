name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: foxpro-mcp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Build executable
        run: bun run build

      - name: Verify binary
        run: Test-Path foxpro-mcp.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: foxpro-mcp/foxpro-mcp.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
